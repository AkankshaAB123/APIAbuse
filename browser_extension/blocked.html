<!DOCTYPE html>
<html>
<head>
  <title>ThreatGuard - Page Blocked</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fce4e4;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 600px;
      border-top: 5px solid #d32f2f;
    }
    h1 {
      color: #d32f2f;
      margin-top: 0;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    #threat-type {
      font-weight: bold;
      font-size: 1.2em;
    }
    .url {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 4px;
      word-break: break-all;
      margin: 20px 0;
      font-family: monospace;
      color: #555;
    }
    button {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h1>Access Blocked</h1>
    <p>ThreatGuard Enterprise IDS intercepted a malicious request.</p>
    <p>Attack Type: <span id="threat-type">Unknown Threat</span></p>
    <div class="url" id="threat-url"></div>
    <button id="back-button">Go Back Safely</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
